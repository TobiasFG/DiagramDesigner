flows:
  - id: checkout
    name: Checkout
    lanes: by-actor
    nodes:
      - { id: start, type: start }
      - { id: submit, type: io, name: Submit cart }
      - { id: validate, type: action, name: Validate cart }
      - { id: in-stock, type: decision, name: In stock? }
      - { id: pay, type: subflow, name: Take payment, ref: payment }
      - { id: backorder, type: action, name: Offer backorder }
      - { id: done, type: end }
    transitions:
      - { from: start, to: submit }
      - { from: submit, to: validate }
      - { from: validate, to: in-stock }
      - { from: in-stock, to: pay, label: "yes" }
      - { from: in-stock, to: backorder, label: "no" }
      - { from: backorder, to: submit, label: retry }
      - { from: pay, to: done }

  - id: payment
    name: Take payment
    nodes:
      - { id: start, type: start }
      - { id: charge, type: action, name: Charge card }
      - { id: ok, type: decision, name: Approved? }
      - { id: paid, type: end, name: Paid }
      - { id: failed, type: end, name: Declined }
    transitions:
      - { from: start, to: charge }
      - { from: charge, to: ok }
      - { from: ok, to: paid, label: "yes" }
      - { from: ok, to: failed, label: "no" }
