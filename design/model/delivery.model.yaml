pipelines:
  - id: ci
    name: CI pipeline
    trigger: push to main
    stages:
      - id: build
        jobs: [ { id: compile }, { id: lint } ]
      - id: test
        needs: [build]
        jobs:
          - { id: unit }
          - { id: e2e, needs: [unit] }
      - id: deploy
        needs: [test]
        jobs:
          - { id: release, name: Release to prod, meta: { status: pending } }
    artifacts:
      - { id: bundle, producedBy: compile, consumedBy: [e2e, release] }
