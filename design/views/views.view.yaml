# Views select part of the model; positions live in ../layout/<view-id>.layout.json.
views:
  - id: system-context
    type: component
    title: Web Shop — system context
    include: [customer, shop, warehouse]
    depth: 0
    export: { formats: [mermaid, svg] }

  - id: shop-containers
    type: component
    title: Web Shop — containers
    scope: shop
    include: ["shop.*", customer, warehouse]
    exclude: ["tag:internal"]
    depth: 1
    aggregateEdges: true
    layout: { algorithm: layered, direction: RIGHT, spacing: 60 }
    export: { formats: [mermaid, svg], file: shop-containers }

  - id: order-components
    type: component
    title: Order Service — components
    include: [ new-person, new-system, new-database, new-queue ]
    layout:
      algorithm: layered
      direction: DOWN
    aggregateEdges: false

  - id: order-domain
    type: class
    title: Order domain
    layout: { direction: UP }

  - id: example-order
    type: object
    title: Example order

  - id: checkout-flow
    type: flow
    title: Checkout
    source: checkout

  - id: ci-pipeline
    type: pipeline
    title: CI pipeline
    source: ci

  - id: place-order
    type: sequence
    title: Place order
    source: place-order
