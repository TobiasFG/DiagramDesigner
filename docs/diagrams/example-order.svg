<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 378 358" width="378" height="358" role="img" aria-labelledby="sdv-title sdv-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">
 <title id="sdv-title">Example order</title>
