<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 668 750" width="668" height="750" role="img" aria-labelledby="sdv-title sdv-desc" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif">
 <title id="sdv-title">Checkout</title>
