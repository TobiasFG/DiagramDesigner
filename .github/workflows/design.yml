# Example workflow for a design repository: fails the build when the model is invalid or
# when committed exports (docs/diagrams) no longer match the model.
name: Design

on:
  push:
    paths: ['design/**', 'docs/**', 'sdv.config.ts', '.github/workflows/design.yml']
  pull_request:
    paths: ['design/**', 'docs/**', 'sdv.config.ts', '.github/workflows/design.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/package-lock.json
      - run: npm ci
        working-directory: tool
      - name: Validate the model
        run: node tool/cli/bin.js validate
      - name: Exports are up to date
        run: node tool/cli/bin.js export --check
