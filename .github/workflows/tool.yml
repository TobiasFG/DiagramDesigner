# CI for the viewer itself: lint, types and unit tests with coverage.
name: Tool

on:
  push:
    paths: ['tool/**', 'design/**', '.github/workflows/tool.yml']
  pull_request:
    paths: ['tool/**', 'design/**', '.github/workflows/tool.yml']

defaults:
  run:
    working-directory: tool

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tool/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - name: Unit tests (coverage gate 80% lines for model, projections, export)
        run: npm run test:coverage
