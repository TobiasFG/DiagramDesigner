# Minimal landscape for judging the zoom interaction: two API providers and one consumer.
# Relationships point from the consumer to the API it calls.

elements:
  - id: shop
    kind: system
    name: Web Shop
    description: Consumes the CRM and ERP APIs
    children:
      - id: shop-web
        kind: container
        name: Shop Web
        technology: React
        children:
          - { id: checkout, kind: component, name: Checkout }
          - { id: account, kind: component, name: My Account }
      - { id: shop-db, kind: datastore, name: Shop DB, technology: Postgres }

  - id: crm
    kind: system
    name: CRM
    description: Provides customer data
    children:
      - id: crm-api
        kind: container
        name: CRM API
        technology: ASP.NET Core
        children:
          - { id: customer-api, kind: component, name: Customer API }
          - { id: loyalty-api, kind: component, name: Loyalty API }
      - { id: crm-db, kind: datastore, name: CRM DB, technology: Azure SQL }

  - id: erp
    kind: system
    name: ERP
    description: Provides orders and stock
    children:
      - id: erp-api
        kind: container
        name: ERP API
        technology: Azure Functions
        children:
          - { id: order-api, kind: component, name: Order API }
          - { id: stock-api, kind: component, name: Stock API }
      - { id: erp-db, kind: datastore, name: ERP DB, technology: Azure SQL }

relationships:
  - { from: checkout, to: order-api, label: Create order }
  - { from: checkout, to: stock-api, label: Check stock }
  - { from: account, to: customer-api, label: Get profile }
  - { from: account, to: loyalty-api, label: Get points }
  - { from: checkout, to: shop-db, label: Stores cart }
  - { from: customer-api, to: crm-db, label: Reads }
  - { from: loyalty-api, to: crm-db, label: Reads }
  - { from: order-api, to: erp-db, label: Writes }
  - { from: stock-api, to: erp-db, label: Reads }
  - { from: order-api, to: customer-api, label: Look up customer }
